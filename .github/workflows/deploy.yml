name: Project Submission Dashboard CI and GHCR Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-submission-dashboard:${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.19.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm lint

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'sampod76/project-submission-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate build configuration
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: |
          test -n "$NEXT_PUBLIC_BASE_URL" || {
            echo "Set repository variable NEXT_PUBLIC_BASE_URL to the confirmed Project Submission backend origin" >&2
            exit 1
          }
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: |
          set -Eeuo pipefail
          export DOCKER_BUILDKIT=1
          IMAGE="ghcr.io/sampod76/project-submission-dashboard:latest"
          docker build \
            --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      # SSH deployment is intentionally absent until the new VPS, checkout,
      # host port and domain have been confirmed. Never reuse an old SSH target.
