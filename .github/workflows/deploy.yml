      #   env:
      #     API_BASE_URL: ${{ vars.API_BASE_URL }}
      #     WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      #   run: node scripts/check-cors.cjs "$API_BASE_URL" "$WEB_ORIGIN"
