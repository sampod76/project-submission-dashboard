name: Project Submission Backend Deploy (GHCR + SSH)

on:
  push:
    branches: [main]

concurrency:
  group: project-submission-dashboard:${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          set -Eeuo pipefail

          export DOCKER_BUILDKIT=1

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          IMAGE="ghcr.io/${OWNER}/project-submission-dashboard:latest"

          echo "Building Docker image: ${IMAGE}"

          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -Eeuo pipefail

            cd ~/apps/sampod/project-submission-dashboard

            bash deploy.sh

      # - name: Verify production CORS preflight
