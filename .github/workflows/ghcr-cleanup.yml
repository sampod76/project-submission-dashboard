name: Project Submission GHCR Cleanup (Delete untagged images)

on:
  schedule:
    - cron: "0 3 * * *" # প্রতিদিন রাত ৩টা
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'sampod76/project-submission-dashboard'
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 Delete untagged images (safe mode)
        uses: actions/delete-package-versions@v5
        with:
          package-name: project-submission-dashboard
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
