name: project-submission-dashboard

services:
  app:
    image: ghcr.io/sampod76/project-submission-dashboard:latest
    container_name: project-submission-dashboard

    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_BASE_URL is embedded by the GHCR build, not configured at runtime.
      HOSTNAME: 0.0.0.0
      PORT: 3000

    ports:
      - "${APP_HOST_PORT:?APP_HOST_PORT must be configured}:3000"

    restart: unless-stopped

    networks:
      - project-submission-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  project-submission-network:
    name: project-submission-network
    driver: bridge
