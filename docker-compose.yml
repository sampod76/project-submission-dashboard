name: project-submission-dashboard-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL must be configured before building}

    container_name: project-submission-dashboard-local

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    ports:
      - "3015:3000"

    restart: unless-stopped

    networks:
      - project-submission-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  project-submission-network:
    name: project-submission-network-local
    driver: bridge
