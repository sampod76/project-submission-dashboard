services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL must be configured before building}

    container_name: doctor-tracking-dashboard-local
    profiles: ["app"]

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    ports:
      - "3052:3000"

    restart: unless-stopped

    networks:
      - doctor-tracker-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  doctor-tracker-network:
    driver: bridge
